name: "Create Release PR"
description: "Create a release PR"

inputs:
  main-branch:
    description: "The branch to publish from"
    default: "main"
    required: false
  changelog:
    description: "The changelog to add to the PR"
    required: true
  version:
    description: "The Version to Release (with prefix)"
    required: true
  github-token:
    description: "The GitHub Token to use for GitHub actions"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create pull request with gh
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
        VERSION: ${{ inputs.version }}
        BRANCH_NAME: release-${{ inputs.version }}
        MAIN_BRANCH: ${{ inputs.main-branch }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        # printf instead of `echo -e`: backslashes in PR titles must not be interpreted as escape sequences.
        printf '%s\n\n_Edit this if needed._\n' "$CHANGELOG" > pr_body
        gh pr create --title "Release $VERSION" --body-file pr_body --base "$MAIN_BRANCH" --head "$BRANCH_NAME" --repo "$REPOSITORY"
